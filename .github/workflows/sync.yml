name: sync
# Opens a PR in every org repo whose AGENTS.md or org hook differs from templates/.
on:
  push:
    branches: [main]
    paths: ["templates/**"]
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m pip install -q pytest && python3 -m pytest -q tests/test_deny_hook.py tests/test_sync.py
      - name: sync
        env:
          # A GitHub App or fine-grained token with contents and pull-requests write on the org's repos.
          GH_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          gh auth setup-git
          git config --global user.name "org-kit-sync"
          git config --global user.email "org-kit-sync@users.noreply.github.com"
          scripts/sync.sh
