name: live-check
# Weekly and on every change: the latest Copilot CLI must still load the agents and honor the hook.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
      - run: npm install -g @github/copilot && copilot --version
      - name: live check
        env:
          # Fine-grained personal access token with the "Copilot Requests" permission.
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: tests/live_check.sh
